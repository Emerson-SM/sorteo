<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador - Sorteo de Rata</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }

        h2 {
            text-align: center;
            color: #fff;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #bbb;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #d9534f;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:active {
            background-color: #c9302c;
        }

        /* Estilos del Ticket en Pantalla Completa Móvil */
        .ticket-view {
            display: none;
            width: 100%;
            max-width: 360px;
            background: #fff;
            border: 3px dashed #d9534f;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            color: #333;
        }

        .ticket-view h1 {
            margin-top: 0;
            color: #d9534f;
            font-size: 26px;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
        }

        .ticket-info {
            margin: 18px 0;
            font-size: 18px;
            text-align: left;
            color: #444;
        }

        .ticket-info span {
            font-weight: bold;
            color: #000;
        }

        .premios-box {
            background: #fff5f5;
            border: 1px solid #ffcdd2;
            padding: 12px;
            border-radius: 8px;
            margin: 18px 0;
            font-size: 15px;
            color: #b71c1c;
            text-align: left;
        }

        .premios-box ul {
            margin: 6px 0 0 20px;
            padding: 0;
        }

        .premios-box li {
            margin-bottom: 4px;
        }

        .numero-badge {
            font-size: 32px;
            background: #e3f2fd;
            color: #1565c0;
            padding: 14px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .fecha {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .btn-volver {
            background: transparent;
            color: #888;
            border: 1px solid #444;
            margin-top: 20px;
            font-size: 14px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- Formulario de Entrada -->
    <div id="formularioBox" class="container">
        <h2>Sorteo de Rata</h2>
        <div class="form-group">
            <label for="nombre">Nombre de la Persona:</label>
            <input type="text" id="nombre" placeholder="Ej. Juan Pérez" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="numero">Número de Ticket:</label>
            <input type="number" id="numero" placeholder="Ej. 07" autocomplete="off">
        </div>
        <button onclick="generarTicket()">Generar Ticket</button>
    </div>

    <!-- Vista del Ticket (Aparece en la misma pantalla lista para Screenshot) -->
    <div id="ticketBox" class="ticket-view">
        <h1>Sorteo de Rata</h1>
        <div class="ticket-info">Participante: <span id="pNombre"></span></div>
        
        <div class="premios-box">
            <strong>Premios a sortear:</strong>
            <ul>
                <li>Una Pizza</li>
                <li>Un Refresco</li>
                <li>Un Vino</li>
            </ul>
        </div>

        <div class="numero-badge">Nº <span id="pNumero"></span></div>
        
        <div class="fecha">Fecha del sorteo: 25 de Octubre</div>

        <button class="btn-volver" onclick="volverAlFormulario()">Crear otro ticket</button>
    </div>

    <script>
        function generarTicket() {
            const nombre = document.getElementById('nombre').value.trim();
            const numero = document.getElementById('numero').value.trim();

            if (!nombre || !numero) {
                alert("Por favor completa tu nombre y el número.");
                return;
            }

            // Asignar datos al ticket
            document.getElementById('pNombre').innerText = nombre;
            document.getElementById('pNumero').innerText = numero;

            // Ocultar formulario y mostrar ticket centrado y legible
            document.getElementById('formularioBox').style.display = 'none';
            document.getElementById('ticketBox').style.display = 'block';
        }

        function volverAlFormulario() {
            document.getElementById('nombre').value = '';
            document.getElementById('numero').value = '';
            document.getElementById('ticketBox').style.display = 'none';
            document.getElementById('formularioBox').style.display = 'block';
        }
    </script>

</body>
</html>
